# ACT 30 Hz profile. Use USB 3.x links for all three cameras.
# Listed device modes verified; simultaneous 30 Hz capture still requires live validation.
schema_version: '1.3'
api_version: v1
camera_namespace: robot/sensors/cameras
cameras:
  head:
    enabled: true
    verified: false
    camera_name: head
    semantic_location: head
    model: D435i
    serial_no: '263022075613'
    streams:
      enable_color: true
      enable_depth: true
      align_depth: true
      pointcloud: false
      enable_sync: true
    profiles:
      color: 640x480x30
      depth: 640x480x30
    diagnostics_period: 1.0
    interface:
      primary_usage: global_scene_perception
      consumers:
      - vision
      - navigation
      - task_planning
      topics:
        color_image: color/image_raw
        color_info: color/camera_info
        depth_image: depth/image_rect_raw
        depth_info: depth/camera_info
        aligned_depth: aligned_depth_to_color/image_raw
        aligned_depth_info: aligned_depth_to_color/camera_info
        color_metadata: color/metadata
        depth_metadata: depth/metadata
        depth_to_color_extrinsics: extrinsics/depth_to_color
      planned_target_frames:
      - base_link
      - map
    frames:
      color_optical: head_color_optical_frame
      aligned_depth_optical: head_color_optical_frame
      depth_optical: head_depth_optical_frame
    depth:
      encoding: 16UC1
      scale_m_per_unit: 0.001
      invalid_value: 0
      window_size: 5
      minimum_valid_pixels: 5
    extrinsics:
      calibrated: false
      mounting_parent_frame: ''
      available_target_frames: []
  left_wrist:
    enabled: true
    verified: false
    camera_name: left_wrist
    semantic_location: left_wrist
    model: D405
    serial_no: '352122274013'
    streams:
      enable_color: true
      enable_depth: true
      align_depth: true
      pointcloud: false
      enable_sync: true
    profiles:
      color: 640x480x30
      depth: 640x480x30
    diagnostics_period: 1.0
    interface:
      primary_usage: left_arm_close_range_perception
      consumers:
      - vision
      - control
      - manipulation
      topics:
        color_image: color/image_raw
        color_info: color/camera_info
        depth_image: depth/image_rect_raw
        depth_info: depth/camera_info
        aligned_depth: aligned_depth_to_color/image_raw
        aligned_depth_info: aligned_depth_to_color/camera_info
        color_metadata: color/metadata
        depth_metadata: depth/metadata
        depth_to_color_extrinsics: extrinsics/depth_to_color
      planned_target_frames:
      - base_link
    frames:
      color_optical: left_wrist_color_optical_frame
      aligned_depth_optical: left_wrist_color_optical_frame
      depth_optical: left_wrist_depth_optical_frame
    depth:
      encoding: 16UC1
      scale_m_per_unit: 0.001
      invalid_value: 0
      window_size: 5
      minimum_valid_pixels: 5
    extrinsics:
      calibrated: false
      mounting_parent_frame: ''
      available_target_frames: []
  right_wrist:
    enabled: true
    verified: false
    camera_name: right_wrist
    semantic_location: right_wrist
    model: D405
    serial_no: '261122274758'
    streams:
      enable_color: true
      enable_depth: true
      align_depth: true
      pointcloud: false
      enable_sync: true
    profiles:
      color: 640x480x30
      depth: 640x480x30
    diagnostics_period: 1.0
    interface:
      primary_usage: right_arm_close_range_perception
      consumers:
      - vision
      - control
      - manipulation
      topics:
        color_image: color/image_raw
        color_info: color/camera_info
        depth_image: depth/image_rect_raw
        depth_info: depth/camera_info
        aligned_depth: aligned_depth_to_color/image_raw
        aligned_depth_info: aligned_depth_to_color/camera_info
