schema_version: "1.3"
api_version: "v1"
camera_namespace: "robot_02/sensors/cameras"

cameras:
  head:
    enabled: true
    verified: true
    camera_name: "head"
    semantic_location: "head"
    model: "D435i"
    serial_no: "263022075613"
    # Current device uses USB 2.1; keep RGB and depth at 15 Hz.
    streams:
      enable_color: true
      enable_depth: true
      align_depth: true
      pointcloud: false
      enable_sync: true
    profiles:
      color: "1280x720x15"
      depth: "640x480x15"
    diagnostics_period: 1.0
    interface:
      primary_usage: "global_scene_perception"
      topics:
        color_image: "color/image_raw"
        color_info: "color/camera_info"
        color_metadata: "color/metadata"
        depth_image: "depth/image_rect_raw"
        depth_info: "depth/camera_info"
        depth_metadata: "depth/metadata"
        aligned_depth: "aligned_depth_to_color/image_raw"
        aligned_depth_info: "aligned_depth_to_color/camera_info"
    frames:
      color_optical: "head_color_optical_frame"
      depth_optical: "head_depth_optical_frame"
      aligned_depth_optical: "head_color_optical_frame"
    depth:
      encoding: "16UC1"
      scale_m_per_unit: 0.001
      invalid_value: 0
    extrinsics:
      calibrated: false
      mounting_parent_frame: ""
      available_target_frames: []

  right_wrist:
    enabled: true
    verified: true
    camera_name: "right_wrist"
    semantic_location: "right_wrist"
    model: "D405"
    serial_no: "352122274535"
    streams:
      enable_color: true
      enable_depth: true
      align_depth: true
      pointcloud: false
      enable_sync: true
    profiles:
      color: "640x480x30"
      depth: "640x480x30"
    diagnostics_period: 1.0
    interface:
      primary_usage: "right_arm_close_range_perception"
      topics:
        color_image: "color/image_raw"
        color_info: "color/camera_info"
        color_metadata: "color/metadata"
        depth_image: "depth/image_rect_raw"
        depth_info: "depth/camera_info"
        depth_metadata: "depth/metadata"
        aligned_depth: "aligned_depth_to_color/image_raw"
        aligned_depth_info: "aligned_depth_to_color/camera_info"
    frames:
      color_optical: "right_wrist_color_optical_frame"
      depth_optical: "right_wrist_depth_optical_frame"
      aligned_depth_optical: "right_wrist_color_optical_frame"
    depth:
      encoding: "16UC1"
      scale_m_per_unit: 0.001
      invalid_value: 0
    extrinsics:
      calibrated: false
      mounting_parent_frame: ""
      available_target_frames: []
